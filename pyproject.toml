[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tello_lib"
dynamic = ["version"]
description = "Control a Tello drone and process its video feed from Python"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Andrew O'Shei", email = "andrewoshei@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    # Not opencv-contrib-python: the two cannot be installed side by side,
    # and most vision packages depend on opencv-python
    "opencv-python>=4.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AOShei/Tello_Drone"
Documentation = "https://github.com/AOShei/Tello_Drone/tree/main/docs"

[tool.setuptools]
packages = ["tello_lib"]

[tool.setuptools.package-data]
tello_lib = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "tello_lib.__version__" }
